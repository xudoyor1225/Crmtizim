{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiqish | Smart Edu</title>

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --navy-900: #0a1628;
            --navy-800: #0f1f35;
            --navy-700: #152642;
            --navy-600: #1c3255;
        }

        body {
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 50%, #1a1a2e 100%);
            font-family: 'Inter', sans-serif;
        }

        .logout-card {
            background: linear-gradient(145deg, rgba(21, 38, 66, 0.9), rgba(15, 31, 53, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(28, 50, 85, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes checkmark {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .float-1 { animation: float 6s ease-in-out infinite; }
        .float-2 { animation: float 8s ease-in-out infinite 1s; }
        .float-3 { animation: float 7s ease-in-out infinite 2s; }

        .checkmark-animation {
            animation: checkmark 0.5s ease-out forwards;
        }

        .countdown {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl float-1"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl float-2"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-500/5 rounded-full blur-3xl float-3"></div>
    </div>

    <div class="w-full max-w-sm logout-card p-8 rounded-3xl shadow-2xl relative z-10 text-center">

        <!-- Success Icon -->
        <div class="mb-6">
            <div class="w-24 h-24 bg-gradient-to-br from-emerald-500 to-green-600 rounded-full mx-auto flex items-center justify-center text-white text-5xl shadow-2xl shadow-emerald-500/30 checkmark-animation">
                <i class="ph-fill ph-check-circle"></i>
            </div>
        </div>

        <!-- Message -->
        <h1 class="text-2xl font-bold text-white mb-2">Xayr! 👋</h1>
        <p class="text-slate-400 mb-6">Siz tizimdan muvaffaqiyatli chiqdingiz</p>

        <!-- Info Box -->
        <div class="bg-[#0f1f35] border border-[#1c3255] rounded-xl p-4 mb-6">
            <div class="flex items-center justify-center gap-2 text-slate-400 text-sm">
                <i class="ph ph-shield-check text-emerald-400"></i>
                <span>Sessiyangiz xavfsiz tugatildi</span>
            </div>
        </div>

        <!-- Countdown -->
        <p class="text-slate-500 text-sm mb-4">
            <span class="countdown" id="countdown">5</span> soniyadan so'ng kirish sahifasiga o'tasiz...
        </p>

        <!-- Button -->
        <a href="{% url 'login' %}"
           class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-blue-500/30 transition-all duration-300 hover:-translate-y-0.5">
            <i class="ph ph-sign-in"></i>
            Qayta kirish
        </a>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-[#1c3255]">
            <div class="flex items-center justify-center gap-2 text-slate-500 text-sm">
                <i class="ph-fill ph-graduation-cap text-blue-400"></i>
                <span>Smart Edu</span>
            </div>
        </div>

    </div>

    <!-- Auto redirect script -->
    <script>
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;

            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>

</body>
</html>
