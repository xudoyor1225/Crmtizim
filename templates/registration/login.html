{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | Smart Edu</title>

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background: linear-gradient(135deg, #F9F7F7 0%, #DBE2EF 30%, #9DB2D6 60%, #3F72AF 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow:
                0 25px 50px rgba(4, 13, 18, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 -20px 40px rgba(255, 255, 255, 0.3) inset;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(63, 114, 175, 0.3);
            color: #112D4E;
            transition: all 250ms ease;
        }

        .input-field:focus {
            border-color: #3F72AF;
            box-shadow: 0 0 0 4px rgba(63, 114, 175, 0.15);
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        .input-field::placeholder {
            color: #9DB2D6;
        }

        .btn-glass {
            background: linear-gradient(135deg, #112D4E 0%, #3F72AF 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(63, 114, 175, 0.3);
            box-shadow: 0 8px 32px rgba(17, 45, 78, 0.25);
            transition: all 300ms ease;
        }

        .btn-glass:hover {
            box-shadow: 0 12px 40px rgba(17, 45, 78, 0.35);
            transform: translateY(-2px);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .float-1 {
            animation: float 6s ease-in-out infinite;
        }

        .float-2 {
            animation: float 8s ease-in-out infinite 1s;
        }

        .float-3 {
            animation: float 7s ease-in-out infinite 2s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s ease-out;
        }

        /* Glass orbs */
        .glass-orb {
            background: linear-gradient(135deg, rgba(157, 178, 214, 0.3), rgba(63, 114, 175, 0.1));
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

    <!-- Background Glass Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 w-72 h-72 glass-orb rounded-full float-1"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 glass-orb rounded-full float-2"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] glass-orb rounded-full float-3 opacity-50">
        </div>
        <div class="absolute top-40 right-40 w-48 h-48 glass-orb rounded-full float-1" style="animation-delay: 0.5s;">
        </div>
        <div class="absolute bottom-40 left-40 w-36 h-36 glass-orb rounded-full float-2" style="animation-delay: 1.5s;">
        </div>
    </div>

    <div class="w-full max-w-sm login-card p-8 rounded-3xl relative z-10 animate-in">

        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div
                class="w-20 h-20 bg-gradient-to-br from-[#112D4E] to-[#3F72AF] rounded-2xl mx-auto flex items-center justify-center text-white text-4xl shadow-xl shadow-[#112D4E]/30 mb-4 backdrop-blur-sm border border-white/20">
                <i class="ph-fill ph-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-bold text-[#112D4E]">Smart Edu</h1>
            <p class="text-[#3F72AF] text-sm mt-1">Tizimga kirish</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.errors %}
            <div
                class="p-4 bg-rose-50/80 backdrop-blur-sm border border-rose-200 text-rose-600 text-sm rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="ph-fill ph-warning-circle text-xl"></i>
                </div>
                <span>Login yoki parol noto'g'ri!</span>
            </div>
            {% endif %}

            <div class="space-y-2">
                <label class="text-xs font-semibold text-[#3F72AF] uppercase ml-1 tracking-wide">Telefon raqam</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#3F72AF] text-lg">
                        <i class="ph-fill ph-phone"></i>
                    </span>
                    <input type="text" name="username" placeholder="998901234567" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-field">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-[#3F72AF] uppercase ml-1 tracking-wide">Parol</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#3F72AF] text-lg">
                        <i class="ph-fill ph-lock-key"></i>
                    </span>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-field">
                </div>
            </div>

            <button type="submit"
                class="w-full py-4 btn-glass text-white font-bold rounded-xl flex items-center justify-center gap-2 mt-6">
                <span>Kirish</span>
                <i class="ph-fill ph-arrow-right"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#9DB2D6]/30 text-center">
            <a href="#"
                class="text-sm text-[#3F72AF] hover:text-[#112D4E] transition-colors flex items-center justify-center gap-2">
                <i class="ph-fill ph-question text-lg"></i>
                Yordam kerakmi?
            </a>
        </div>
    </div>

    <!-- Version Badge -->
    <div class="fixed bottom-4 right-4 text-xs text-[#3F72AF]/70 backdrop-blur-sm bg-white/30 px-3 py-1 rounded-full">
        Smart Edu v4.0
    </div>

</body>

</html>
