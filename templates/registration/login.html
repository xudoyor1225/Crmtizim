{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | Smart Edu</title>

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --navy-900: #0a1628;
            --navy-800: #0f1f35;
            --navy-700: #152642;
            --navy-600: #1c3255;
        }

        body {
            background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 50%, #1a1a2e 100%);
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(21, 38, 66, 0.9), rgba(15, 31, 53, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(28, 50, 85, 0.5);
        }

        .input-dark {
            background: var(--navy-800);
            border: 1px solid var(--navy-600);
            color: white;
        }

        .input-dark:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .input-dark::placeholder {
            color: #64748b;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .float-1 {
            animation: float 6s ease-in-out infinite;
        }

        .float-2 {
            animation: float 8s ease-in-out infinite 1s;
        }

        .float-3 {
            animation: float 7s ease-in-out infinite 2s;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl float-1"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl float-2"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-500/5 rounded-full blur-3xl float-3">
        </div>
    </div>

    <div class="w-full max-w-sm login-card p-8 rounded-3xl shadow-2xl relative z-10">

        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div
                class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-white text-4xl shadow-2xl shadow-blue-500/30 mb-4">
                <i class="ph-fill ph-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Smart Edu</h1>
            <p class="text-slate-400 text-sm mt-1">Tizimga kirish</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.errors %}
            <div
                class="p-4 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="ph-fill ph-warning-circle text-xl"></i>
                </div>
                <span>Login yoki parol noto'g'ri!</span>
            </div>
            {% endif %}

            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Telefon raqam</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg">
                        <i class="ph-fill ph-phone"></i>
                    </span>
                    <input type="text" name="username" placeholder="998901234567" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-dark transition-all">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase ml-1">Parol</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg">
                        <i class="ph-fill ph-lock-key"></i>
                    </span>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-dark transition-all">
                </div>
            </div>

            <button type="submit"
                class="w-full py-4 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all transform hover:-translate-y-0.5 active:scale-[0.98] flex items-center justify-center gap-2 mt-6">
                <span>Kirish</span>
                <i class="ph-fill ph-arrow-right"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#1c3255] text-center">
            <a href="#"
                class="text-sm text-slate-500 hover:text-blue-400 transition-colors flex items-center justify-center gap-2">
                <i class="ph-fill ph-question text-lg"></i>
                Yordam kerakmi?
            </a>
        </div>
    </div>

    <!-- Version Badge -->
    <div class="fixed bottom-4 right-4 text-xs text-slate-600">
        Smart Edu v4.0
    </div>

</body>

</html>
