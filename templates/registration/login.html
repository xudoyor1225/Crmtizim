{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | Smart Edu</title>

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background: linear-gradient(135deg, #F9F7F7 0%, #EEF2F9 50%, #F4F7FB 100%);
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 114, 175, 0.15);
            box-shadow: 0 25px 50px rgba(17, 45, 78, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
        }

        .input-field {
            background: #F9F7F7;
            border: 1.5px solid rgba(63, 114, 175, 0.2);
            color: #112D4E;
            transition: all 200ms ease;
        }

        .input-field:focus {
            border-color: #3F72AF;
            box-shadow: 0 0 0 4px rgba(63, 114, 175, 0.08);
            outline: none;
            background: white;
        }

        .input-field::placeholder {
            color: #7A9CC5;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .float-1 {
            animation: float 6s ease-in-out infinite;
        }

        .float-2 {
            animation: float 8s ease-in-out infinite 1s;
        }

        .float-3 {
            animation: float 7s ease-in-out infinite 2s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 w-72 h-72 bg-[#7A9CC5]/10 rounded-full blur-3xl float-1"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-[#3F72AF]/10 rounded-full blur-3xl float-2"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#7A9CC5]/5 rounded-full blur-3xl float-3">
        </div>
    </div>

    <div class="w-full max-w-sm login-card p-8 rounded-3xl relative z-10 animate-in">

        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div
                class="w-20 h-20 bg-gradient-to-br from-[#3F72AF] to-[#112D4E] rounded-2xl mx-auto flex items-center justify-center text-white text-4xl shadow-xl shadow-[#3F72AF]/25 mb-4">
                <i class="ph-fill ph-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-bold text-[#112D4E]">Smart Edu</h1>
            <p class="text-[#7A9CC5] text-sm mt-1">Tizimga kirish</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.errors %}
            <div class="p-4 bg-rose-50 border border-rose-200 text-rose-600 text-sm rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="ph-fill ph-warning-circle text-xl"></i>
                </div>
                <span>Login yoki parol noto'g'ri!</span>
            </div>
            {% endif %}

            <div class="space-y-2">
                <label class="text-xs font-semibold text-[#7A9CC5] uppercase ml-1">Telefon raqam</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#7A9CC5] text-lg">
                        <i class="ph-fill ph-phone"></i>
                    </span>
                    <input type="text" name="username" placeholder="998901234567" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-field">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-[#7A9CC5] uppercase ml-1">Parol</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#7A9CC5] text-lg">
                        <i class="ph-fill ph-lock-key"></i>
                    </span>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full pl-12 pr-4 py-3.5 rounded-xl input-field">
                </div>
            </div>

            <button type="submit"
                class="w-full py-4 bg-gradient-to-r from-[#3F72AF] to-[#112D4E] hover:from-[#355F93] hover:to-[#1C3A5E] text-white font-bold rounded-xl shadow-lg shadow-[#3F72AF]/25 transition-all transform hover:-translate-y-0.5 active:scale-[0.98] flex items-center justify-center gap-2 mt-6">
                <span>Kirish</span>
                <i class="ph-fill ph-arrow-right"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#7A9CC5]/15 text-center">
            <a href="#"
                class="text-sm text-[#7A9CC5] hover:text-[#3F72AF] transition-colors flex items-center justify-center gap-2">
                <i class="ph-fill ph-question text-lg"></i>
                Yordam kerakmi?
            </a>
        </div>
    </div>

    <!-- Version Badge -->
    <div class="fixed bottom-4 right-4 text-xs text-[#7A9CC5]">
        Smart Edu v4.0
    </div>

</body>

</html>
