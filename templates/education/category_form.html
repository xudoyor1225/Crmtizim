{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden">

        <!-- Header -->
        <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gradient-to-r from-indigo-500 to-purple-600">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="ph ph-folder-plus"></i>
                {{ title }}
            </h2>
        </div>

        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}

            <!-- Nomi -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Kategoriya nomi *
                </label>
                <input type="text" name="name" required
                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    placeholder="M: Video darslar">
            </div>

            <!-- Ikonka -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Ikonka (emoji)
                </label>
                <input type="text" name="icon" value="📁" maxlength="10"
                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-2xl"
                    placeholder="📁">
                <p class="text-xs text-gray-500 mt-1">Misol: 🎬 📄 🎧 📝 📦</p>
            </div>

            <!-- Tugmalar -->
            <div class="flex gap-3 pt-4">
                <button type="submit"
                    class="flex-1 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl hover:shadow-lg transition flex items-center justify-center gap-2">
                    <i class="ph ph-check-circle"></i> Saqlash
                </button>
                <a href="{% url 'material_category_list' %}"
                    class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-200 transition flex items-center gap-2">
                    <i class="ph ph-x"></i> Bekor
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
