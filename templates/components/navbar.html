<header class="flex items-center justify-between px-6 py-3 bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">

    <!-- Sidebar Toggle (Mobil uchun) -->
    <button @click="sidebarOpen = !sidebarOpen" class="text-slate-500 focus:outline-none lg:hidden">
        <i class="ph ph-list text-2xl"></i>
    </button>

    <!-- Filial nomi -->
    <div class="hidden md:flex items-center gap-2">
        <i class="ph ph-buildings text-slate-400 text-lg"></i>
        <span class="font-medium text-slate-600">{{ request.user.branch.name|default:"Bosh Filial" }}</span>
    </div>

    <!-- O'ng tomon (Bildirishnomalar) -->
    <div class="flex items-center gap-4">

        <!-- Bildirishnoma -->
        <button class="relative p-2 text-slate-400 hover:text-primary transition-colors">
            <i class="ph ph-bell text-xl"></i>
            <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
        </button>

        <!-- Sozlamalar -->
        <a href="{% url 'core:settings' %}" class="p-2 text-slate-400 hover:text-primary transition-colors" title="Sozlamalar">
            <i class="ph ph-gear text-xl"></i>
        </a>

        <!-- Admin Panel (faqat super_admin uchun) -->
        {% if request.user.role == 'super_admin' or request.user.is_superuser %}
        <a href="/admin/" class="p-2 text-slate-400 hover:text-[#1D546D] transition-colors" title="Admin Panel">
            <i class="ph ph-arrow-square-out text-xl"></i>
        </a>
        {% endif %}

        <!-- Chiqish -->
        <a href="{% url 'logout' %}" class="p-2 text-slate-400 hover:text-red-500 transition-colors" title="Chiqish">
            <i class="ph ph-sign-out text-xl"></i>
        </a>

    </div>
</header>
