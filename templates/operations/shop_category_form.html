{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400">Do'kon kategoriyasini sozlang</p>
        </div>
        <a href="{% url 'operations:shop_category_list' %}"
            class="px-4 py-2 rounded-xl bg-[#1c3255] text-slate-300 hover:bg-[#234069] transition">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="rounded-2xl p-6 bg-gradient-to-br from-[#152642] to-[#0f1f35] border border-[#1c3255]">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Kategoriya nomi *</label>
                <input type="text" name="name" value="{{ category.name|default:'' }}" required
                    class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                    placeholder="Masalan: Kitoblar">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Ikonka (emoji)</label>
                <input type="text" name="icon" value="{{ category.icon|default:'📦' }}"
                    class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white text-2xl placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                    placeholder="📦">
                <p class="text-xs text-slate-500 mt-1">Emoji tanlang: 📚 📱 🎁 💸 🎧 👕 ✏️</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Tartib raqami</label>
                <input type="number" name="order" value="{{ category.order|default:0 }}"
                    class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                    placeholder="0">
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit"
                    class="flex-1 px-6 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-xl hover:shadow-lg transition font-medium">
                    <i class="ph ph-check"></i> Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
