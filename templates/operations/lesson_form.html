{% extends 'base.html' %}

{% block title %}Yangi Dars{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Yangi Dars Qo'shish</h1>
            <p class="text-gray-500">Dars jadvalini to'ldiring</p>
        </div>
        <a href="{% url 'operations:lesson_list' %}"
            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition flex items-center gap-2">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Guruh -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Guruh *</label>
                    <select name="group" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">Tanlang...</option>
                        {% for group in groups %}
                        <option value="{{ group.id }}">{{ group.name }} ({{ group.teacher.first_name|default:"-" }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Sana -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Sana *</label>
                    <input type="date" name="date" value="{{ today }}" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Boshlanish vaqti -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Boshlanish *</label>
                    <input type="time" name="start_time" value="09:00" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Tugash vaqti -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tugash *</label>
                    <input type="time" name="end_time" value="10:30" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Xona -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Xona</label>
                    <select name="room"
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">Tanlang...</option>
                        {% for room in rooms %}
                        <option value="{{ room.id }}">{{ room.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Mavzu -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dars mavzusi</label>
                    <input type="text" name="topic" placeholder="Masalan: Unit 5 - Grammar"
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <!-- Submit -->
            <div class="flex justify-end gap-3 pt-4 border-t">
                <a href="{% url 'operations:lesson_list' %}"
                    class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">
                    Bekor qilish
                </a>
                <button type="submit"
                    class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-indigo-700 transition flex items-center gap-2">
                    <i class="ph ph-check"></i> Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
