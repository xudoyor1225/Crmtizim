{% extends 'base.html' %}

{% block title %}Yangi Dars{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">Yangi Dars Qo'shish 📝</h1>
            <p class="text-slate-400">Dars jadvalini to'ldiring</p>
        </div>
        <a href="{% url 'operations:lesson_list' %}"
            class="px-4 py-2.5 rounded-xl flex items-center gap-2 transition font-medium bg-[#1c3255] text-slate-300 hover:bg-[#234069]">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <!-- Form -->
    <div class="rounded-2xl p-6 bg-gradient-to-br from-[#152642] to-[#0f1f35] border border-[#1c3255]">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Guruh -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Guruh *</label>
                    <select name="group" required
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                        <option value="">Tanlang...</option>
                        {% for group in groups %}
                        <option value="{{ group.id }}">{{ group.name }} ({{ group.teacher.first_name|default:"-" }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Sana -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Sana *</label>
                    <input type="date" name="date" value="{{ today }}" required
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>

                <!-- Boshlanish vaqti -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Boshlanish *</label>
                    <input type="time" name="start_time" value="09:00" required
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>

                <!-- Tugash vaqti -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Tugash *</label>
                    <input type="time" name="end_time" value="10:30" required
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>

                <!-- Xona -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Xona</label>
                    <select name="room"
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                        <option value="">Tanlang...</option>
                        {% for room in rooms %}
                        <option value="{{ room.id }}">{{ room.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Mavzu -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Dars mavzusi</label>
                    <input type="text" name="topic" placeholder="Masalan: Unit 5 - Grammar"
                        class="w-full px-4 py-3 rounded-xl border bg-[#0f1f35] border-[#1c3255] text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
                </div>
            </div>

            <!-- Submit -->
            <div class="flex justify-end gap-3 pt-6 border-t border-[#1c3255]">
                <a href="{% url 'operations:lesson_list' %}"
                    class="px-6 py-3 rounded-xl font-medium transition bg-[#1c3255] text-slate-300 hover:bg-[#234069]">
                    Bekor qilish
                </a>
                <button type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-xl hover:shadow-lg hover:shadow-indigo-500/25 transition flex items-center gap-2 font-medium">
                    <i class="ph ph-check"></i> Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
